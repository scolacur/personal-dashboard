# CD (cloud half) — build the app image and push it to GHCR on every merge to main.
#
# WHY THIS EXISTS: the NAS is a CPU-weak Synology behind a home LAN with no public
# ingress, so (a) cloud CI cannot reach in to trigger a deploy, and (b) building the
# multi-stage image ON the NAS each push is exactly the boundless-resource cost the
# TODO warns about. The fix is pull-based deploy: build the image HERE (free, fast
# cloud runners), publish it to GitHub Container Registry, and let a Watchtower
# container on the NAS poll the registry and recreate the app when the tag moves.
# This workflow is the cloud half. The NAS half (Watchtower + registry-based compose)
# is in ops/deploy/README.md — a runbook to run while physically at the NAS.
#
# DECOUPLED FROM CI: this never runs on PR head code. It triggers only on push to
# main (i.e. after a human approves + merges) and on manual dispatch. So an untrusted
# fork PR can be *tested* (ci.yml) but can never cause an image to be published.
#
# AUTH: GITHUB_TOKEN with packages:write is enough to push to ghcr.io for this repo;
# no PAT needed. The image inherits the repo's visibility (public repo -> public
# package) unless changed in the repo's Packages settings.

name: deploy

on:
  push:
    branches: [main]
  # Manual runs, AND the auto-merge bridge: a merge made with GITHUB_TOKEN fires no `push` workflows
  # (GitHub suppresses them), so robot-auto-merge dispatches this after every merge it makes (PD-999).
  workflow_dispatch:
    inputs:
      force_worker:
        description: Publish the agent-worker image even if none of its build inputs changed
        type: boolean
        default: false

concurrency:
  group: deploy
  cancel-in-progress: false # let an in-flight publish finish; don't ship a half-built tag

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    env:
      # ghcr.io/<owner>/<repo>, lowercased (GHCR rejects upper-case paths).
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      # Two tags: :latest (what Watchtower watches) and :<short-sha> (immutable, so a
      # bad deploy can be pinned/rolled back to a known-good sha in compose).
      - name: Compute tags
        id: tags
        run: |
          set -euo pipefail
          SHA="${GITHUB_SHA::7}"
          echo "tags=${IMAGE}:latest,${IMAGE}:${SHA}" >> "$GITHUB_OUTPUT"
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            APP_VERSION=${{ steps.tags.outputs.sha }}
          # Cache layers in GHA so unchanged deps (the npm ci layer) don't rebuild.
          # Distinct scope from the agent-worker job below so the two images' caches
          # (different Dockerfiles, different deps) don't collide and poison each other.
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app

  # Does main differ from the PUBLISHED worker image in anything that goes into it? (PD-816, PD-999)
  #
  # A dedicated Watchtower on the host recreates the worker whenever :latest moves, and every
  # recreate drains: it holds new Robot dispatch until in-flight runs finish. BUILD_SHA changes the
  # image digest on EVERY build, so publishing unconditionally would drain + recreate the worker on
  # every merge, web-only ones included. So the worker publishes only when its inputs change. The
  # inputs are listed once, in ops/agent-worker/build-inputs.txt, which the worker's heartbeat also
  # reads. That lets the dashboard tell "behind main" apart from "main moved on without touching
  # the worker".
  #
  # Compared against the commit the published :latest was BUILT FROM (its baked-in
  # AGENT_WORKER_BUILD_SHA), not against the push's `before`. Two reasons:
  #   - The auto-merge bridge's merges arrive as workflow_dispatch, which carries no range.
  #   - The `deploy` concurrency group cancels a PENDING run when a newer one queues, so a burst of
  #     merges can skip runs. A per-push range would then lose the cancelled run's worker change.
  #     Diffing from what is actually published can't skip anything.
  # No third-party action, only the registry API with an anonymous pull token (the package is public).
  # If anything can't be resolved, publish. When unsure, deploy; the drain protects runs.
  agent-worker-changed:
    runs-on: ubuntu-latest
    outputs:
      worker: ${{ steps.diff.outputs.worker }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Diff main against the published worker image's build commit
        id: diff
        env:
          FORCE: ${{ inputs.force_worker || false }}
          REPO_IMAGE: ${{ github.repository }}-agent-worker
        run: |
          set -euo pipefail
          publish() { echo "worker=true" >> "$GITHUB_OUTPUT"; echo "publish: $1"; exit 0; }
          [ "$FORCE" = "true" ] && publish "forced by workflow_dispatch input"

          # The :latest worker image's AGENT_WORKER_BUILD_SHA, via the registry API. The image is
          # an OCI index (amd64 + an attestation manifest), so resolve the linux/amd64 manifest first.
          IMG="$(echo "$REPO_IMAGE" | tr '[:upper:]' '[:lower:]')"
          ACCEPT='application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.list.v2+json,application/vnd.oci.image.manifest.v1+json,application/vnd.docker.distribution.manifest.v2+json'
          TOKEN="$(curl -fsS "https://ghcr.io/token?scope=repository:${IMG}:pull" | jq -r .token)" || publish "no registry token"
          reg() { curl -fsSL -H "Authorization: Bearer $TOKEN" -H "Accept: $ACCEPT" "https://ghcr.io/v2/${IMG}/$1"; }
          M="$(reg manifests/latest)" || publish "no published :latest"
          D="$(echo "$M" | jq -r '[.manifests[]? | select(.platform.os=="linux" and .platform.architecture=="amd64")][0].digest // empty')"
          [ -n "$D" ] && { M="$(reg "manifests/$D")" || publish "amd64 manifest unreadable"; }
          CFG="$(echo "$M" | jq -r '.config.digest // empty')"
          [ -n "$CFG" ] || publish "no image config"
          PUBLISHED="$(reg "blobs/$CFG" | jq -r '.config.Env[]? | select(startswith("AGENT_WORKER_BUILD_SHA=")) | sub("^AGENT_WORKER_BUILD_SHA=";"")' | head -1)" || true
          [ -n "${PUBLISHED:-}" ] || publish "published image has no BUILD_SHA"
          git cat-file -e "${PUBLISHED}^{commit}" 2>/dev/null || publish "published BUILD_SHA $PUBLISHED not in history"

          mapfile -t INPUTS < <(grep -vE '^[[:space:]]*(#|$)' ops/agent-worker/build-inputs.txt)
          CHANGED=$(git diff --name-only "$PUBLISHED" "$GITHUB_SHA" -- "${INPUTS[@]}")
          if [ -n "$CHANGED" ]; then
            publish "worker inputs changed since published $PUBLISHED:"$'\n'"$CHANGED"
          fi
          echo "worker=false" >> "$GITHUB_OUTPUT"; echo "skip: no worker inputs changed since published $PUBLISHED"

  # The agent-worker (Robot loop / Refine / Audit host) image (PD-802). The dedicated, scoped
  # Watchtower in ops/agent-worker/docker-compose.egress.yml pulls it and recreates the worker behind
  # the deploy-drain pre-update hook (PD-816). The worker Dockerfile bakes NO secrets (they arrive
  # via env_file at runtime), so the resulting GHCR package is safe to be public.
  build-and-push-agent-worker:
    needs: agent-worker-changed
    if: needs.agent-worker-changed.outputs.worker == 'true'
    runs-on: ubuntu-latest
    env:
      # ghcr.io/<owner>/<repo>-agent-worker, lowercased (GHCR rejects upper-case paths).
      IMAGE: ghcr.io/${{ github.repository }}-agent-worker
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      # Two tags: :latest (what the worker's Watchtower watches) and :<short-sha> (immutable, so a
      # bad worker deploy can be pinned/rolled back to a known-good sha in compose).
      - name: Compute tags
        id: tags
        run: |
          set -euo pipefail
          SHA="${GITHUB_SHA::7}"
          echo "tags=${IMAGE}:latest,${IMAGE}:${SHA}" >> "$GITHUB_OUTPUT"
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"

      # context = repo root (the worker Dockerfile COPYs the root manifest/lock, packages/shared,
      # and apps/agent-worker). BUILD_SHA (NOT APP_VERSION): the worker declares `ARG BUILD_SHA`
      # -> AGENT_WORKER_BUILD_SHA, the heartbeat's real version (D-079, PD-528). Unset would bake
      # an empty sha and the dashboard would show "build unknown".
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ops/agent-worker/Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            BUILD_SHA=${{ steps.tags.outputs.sha }}
          # Distinct cache scope from the app job above (see note there).
          cache-from: type=gha,scope=agent-worker
          cache-to: type=gha,mode=max,scope=agent-worker
