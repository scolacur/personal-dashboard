# Robot auto-merge bridge: squash-merges any PR an authorized human has approved
# once it is fully mergeable (all required checks green, no conflicts, reviews satisfied).
#
# WHY THIS EXISTS: branch protection on `main` requires the `verify` check + 1 approving
# review + no merge conflicts, but a pure APPROVED review triggers nothing on its own.
# Without this, Steve would merge every green PR by hand. This bridge closes that gap and
# follows the house pattern (D-042): a pure GitHub-side Actions bridge, no external runtime.
#
# AUTHORIZATION: repo OWNER (scolacur) directly, OR a COLLABORATOR review carrying the
# <!-- robot:human-reply --> marker. The bot account (sortie-bot-55) is a COLLABORATOR
# without the marker, so its own reviews never qualify.
# (The marker string tracks HUMAN_REPLY_MARKER in @dashboard/shared — the board's reply
# mirror stamps it and this workflow + the Robot loop's pr-state trust check consume it, so
# all three must use the same value. The sortie-bot-55 login is kept verbatim — it is a real
# GitHub identity — so this cleanup leaves it literal.)
#
# MERGE CONDITION: state == OPEN, a standing authorized APPROVED review, and
# mergeStateStatus == CLEAN (GitHub's "no conflicts + all required checks green + reviews
# satisfied"). Keying off mergeStateStatus rather than a hard-coded check name means any
# future required check (e.g., the D-047 path-guard) is honored automatically.
#
# SELF-BLOCK (PD-424, found on PR #268) — why CLEAN alone is not enough. This job registers
# as a check on the PR head ("auto-merge / robot-auto-merge" in statusCheckRollup). While the
# run is in flight that check is pending, so GitHub reports UNSTABLE — the bridge reads its
# OWN in-progress check and declines to merge. Nothing re-fires afterwards, so an approval
# landing on an already-green PR sat unmerged until a human did it by hand.
#
# Polling for CLEAN cannot fix this: the pending check IS this job, so waiting deadlocks by
# construction (the job cannot complete while it waits for itself). Instead, when the PR is
# not CLEAN we re-evaluate ignoring THIS workflow's own check — no conflicts, review
# satisfied, and every OTHER check complete and green — and then attempt the merge.
#
# That is safe because `gh pr merge` is not the authority: branch protection is. The token
# cannot bypass a required check, so the worst case of a wrong local judgement is a refused
# merge, logged, with the PR left open. This also keeps honouring future required checks:
# a new one shows up in the rollup as "not green yet" and holds the merge.
#
# TRIGGER — the "approved before CI was green" case (amends D-052): when the approval lands
# before CI finishes, the review-triggered run sees mergeStateStatus != CLEAN and skips,
# planning to re-fire when CI goes green. That re-fire MUST come from `workflow_run`, NOT
# `check_suite`/`status`: GitHub suppresses check_suite/status events that originate from
# GITHUB_TOKEN (which is what runs the `ci` workflow) to prevent recursive runs, so those
# triggers are silently dead here. `workflow_run` is GitHub's sanctioned exception for
# chaining off another workflow's completion and fires even for GITHUB_TOKEN-run workflows.
#
# STANDING REVIEW: reviews are grouped by reviewer; only each reviewer's *latest* review
# counts. If an authorized approver later submits CHANGES_REQUESTED, that supersedes the
# earlier APPROVED and will no longer qualify.
#
# IDEMPOTENCY / LOOP SAFETY: the script skips any PR that is not OPEN — a merged/closed PR
# is a safe no-op. A merged PR is no longer OPEN, so re-fires after merge are no-ops. The
# bot's own workflow activity never passes the authorized-review gate. A `ci` run on push
# to main resolves to no open PR head → "No open PRs found" → no-op.

name: robot-auto-merge

on:
  # Fires when a human approves a PR — merge immediately if already CLEAN.
  pull_request_review:
    types: [submitted]
  # Fires when the `ci` workflow finishes — catches the common case where the approval
  # landed BEFORE CI was green. MUST be workflow_run (see TRIGGER note in the header):
  # check_suite/status events from GITHUB_TOKEN don't trigger workflows, so they were dead.
  workflow_run:
    workflows: ["ci"]
    types: [completed]
  # Fires when a PR is force-pushed or reopened after an earlier check.
  pull_request:
    types: [synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

# One in-flight merge attempt per PR (or per commit SHA when the PR number is unknown).
concurrency:
  group: robot-auto-merge-${{ github.event.pull_request.number || github.event.workflow_run.head_sha || 'global' }}
  cancel-in-progress: false

jobs:
  auto-merge:
    # Event gate:
    #  - pull_request_review: only an APPROVED review from an authorized user.
    #  - workflow_run: only when the `ci` run succeeded (a failed CI can't be CLEAN anyway).
    #  - pull_request (synchronize/reopened): always run.
    if: >-
      (
        github.event_name == 'pull_request_review' &&
        github.event.review.state == 'approved' &&
        (
          github.event.review.author_association == 'OWNER' ||
          (
            github.event.review.author_association == 'COLLABORATOR' &&
            contains(github.event.review.body, '<!-- robot:human-reply -->')
          )
        )
      ) ||
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success'
      ) ||
      github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - name: Squash-merge any approved and fully mergeable PRs
        run: |
          set -euo pipefail

          BOT_LOGIN="sortie-bot-55"
          EVENT="${{ github.event_name }}"

          # ── 1. Resolve which PR(s) to check ─────────────────────────────────
          declare -a PRS=()

          if [ "$EVENT" = "pull_request_review" ] || [ "$EVENT" = "pull_request" ]; then
            PRS=("${{ github.event.pull_request.number }}")
          elif [ "$EVENT" = "workflow_run" ]; then
            # workflow_run carries no PR number — map the CI run's head SHA to an open PR.
            # (Note: gh's --jq flag does NOT accept --arg, so pipe to the runner's real jq.)
            HEAD_SHA="${{ github.event.workflow_run.head_sha }}"
            mapfile -t PRS < <(
              gh pr list --repo "$REPO" --state open --json number,headRefOid \
                | jq -r --arg sha "$HEAD_SHA" \
                  '.[] | select(.headRefOid == $sha) | .number'
            )
          fi

          if [ "${#PRS[@]}" -eq 0 ]; then
            echo "No open PRs found for event=$EVENT — skip."
            exit 0
          fi

          for PR in "${PRS[@]}"; do
            echo "─── Checking PR #$PR ───"

            # ── 2. Idempotency: skip if not OPEN ────────────────────────────────
            DATA="$(gh pr view "$PR" --repo "$REPO" \
              --json state,mergeable,mergeStateStatus,reviews)"
            STATE="$(echo "$DATA" | jq -r .state)"

            if [ "$STATE" != "OPEN" ]; then
              echo "PR #$PR state=$STATE (not OPEN) — already merged/closed, skip."
              continue
            fi

            # ── 3. Check for a standing authorized APPROVED review ───────────────
            # Group by reviewer, take each reviewer's most recent review, then check
            # whether any authorized reviewer's latest review is APPROVED.
            AUTHORIZED_APPROVED="$(echo "$DATA" | jq -r --arg bot "$BOT_LOGIN" '
              .reviews
              | map(select(.author != null))
              | group_by(.author.login)
              | map(sort_by(.submittedAt) | last)
              | map(select(
                  .state == "APPROVED" and
                  .author.login != $bot and
                  (
                    .authorAssociation == "OWNER" or
                    (
                      .authorAssociation == "COLLABORATOR" and
                      ((.body // "") | contains("<!-- robot:human-reply -->"))
                    )
                  )
                ))
              | length > 0
            ')"

            if [ "$AUTHORIZED_APPROVED" != "true" ]; then
              echo "PR #$PR: no authorized standing APPROVED review — skip."
              continue
            fi

            echo "PR #$PR has an authorized APPROVED review — checking mergeability."

            # ── 4. Poll mergeStateStatus past UNKNOWN ──
            # UNKNOWN means GitHub has not finished computing mergeability yet (distinct from
            # the self-block below, which is a settled UNSTABLE that will never clear on its own).
            MERGE_STATE="UNKNOWN"
            POLL=""
            CLOSED_DURING_POLL=false
            for _ in 1 2 3 4 5; do
              POLL="$(gh pr view "$PR" --repo "$REPO" \
                --json state,mergeable,mergeStateStatus,reviewDecision,statusCheckRollup)"
              if [ "$(echo "$POLL" | jq -r .state)" != "OPEN" ]; then
                echo "PR #$PR closed during mergeability poll — skip."
                CLOSED_DURING_POLL=true
                break
              fi
              MERGE_STATE="$(echo "$POLL" | jq -r .mergeStateStatus)"
              [ "$MERGE_STATE" != "UNKNOWN" ] && break
              sleep 5
            done

            if [ "$CLOSED_DURING_POLL" = "true" ]; then
              continue
            fi

            echo "PR #$PR mergeStateStatus=$MERGE_STATE"

            # ── 5. Decide whether to attempt the merge ──────────────────────────
            # CLEAN is the fast path. Otherwise apply the PD-424 rule: is this bridge's own
            # check the only thing outstanding?
            ATTEMPT="no"
            SELF_BLOCKED="no"
            if [ "$MERGE_STATE" = "CLEAN" ]; then
              ATTEMPT="yes"
            else
              MERGEABLE="$(echo "$POLL" | jq -r '.mergeable // "UNKNOWN"')"
              REVIEW_DECISION="$(echo "$POLL" | jq -r '.reviewDecision // ""')"

              # Every check EXCEPT this workflow's own, deduped to the LATEST run per check.
              #
              # Matched on workflowName (the workflow, not the job) so renaming the job cannot
              # silently re-enable the self-block.
              #
              # The dedupe is not cosmetic: the rollup carries EVERY run of a check, so one that
              # failed and was later re-run green appears twice. Counting the stale failure would
              # refuse to merge a PR that is actually green — reintroducing the very "sat unmerged
              # until a human did it by hand" bug this fix exists to remove. Observed on PR #293:
              # a red path-guard, then a green one after the approval label was applied. Same
              # shape as the standing-review rule above — group, then take each one's latest.
              OTHERS="$(echo "$POLL" | jq -c '
                [ .statusCheckRollup[]?
                  | select((.workflowName // "") != "robot-auto-merge") ]
                | group_by(.name // .context // "")
                | map(sort_by(.startedAt // .completedAt // "") | last)
              ')"
              OTHERS_PENDING="$(echo "$OTHERS" | jq '
                [ .[] | select(
                    (((.status // "") | ascii_upcase) | IN("QUEUED", "IN_PROGRESS", "PENDING", "WAITING", "REQUESTED"))
                    or (((.state // "") | ascii_upcase) == "PENDING")
                  ) ] | length
              ')"
              OTHERS_FAILED="$(echo "$OTHERS" | jq '
                [ .[] | select(
                    (((.conclusion // "") | ascii_upcase) | IN("FAILURE", "CANCELLED", "TIMED_OUT", "ACTION_REQUIRED", "STARTUP_FAILURE"))
                    or (((.state // "") | ascii_upcase) | IN("FAILURE", "ERROR"))
                  ) ] | length
              ')"

              echo "PR #$PR mergeable=$MERGEABLE reviewDecision=$REVIEW_DECISION others_pending=$OTHERS_PENDING others_failed=$OTHERS_FAILED"

              if [ "$MERGEABLE" = "MERGEABLE" ] && [ "$REVIEW_DECISION" = "APPROVED" ] \
                 && [ "$OTHERS_PENDING" -eq 0 ] && [ "$OTHERS_FAILED" -eq 0 ]; then
                ATTEMPT="yes"
                SELF_BLOCKED="yes"
              fi
            fi

            if [ "$ATTEMPT" != "yes" ]; then
              echo "PR #$PR not mergeable yet (mergeStateStatus=$MERGE_STATE) — skip; will merge once it becomes CLEAN."
              continue
            fi

            # ── 6. Squash merge — branch left intact (no --delete-branch) ────────
            if [ "$SELF_BLOCKED" = "yes" ]; then
              # Branch protection still arbitrates: a refusal here means our reading was wrong,
              # which is information, not a failure — log it and leave the PR open.
              echo "PR #$PR: $MERGE_STATE is this bridge's own in-flight check (PD-424); every other check is green — attempting merge."
              if gh pr merge "$PR" --repo "$REPO" --squash; then
                echo "PR #$PR merged successfully."
              else
                echo "PR #$PR: GitHub refused the merge — branch protection is the authority; leaving it open."
              fi
            else
              echo "PR #$PR is CLEAN with an authorized APPROVED review — squash-merging."
              gh pr merge "$PR" --repo "$REPO" --squash
              echo "PR #$PR merged successfully."
            fi
          done
